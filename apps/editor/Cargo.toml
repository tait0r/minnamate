[package]
name = "minnamate-editor"
version.workspace = true
edition.workspace = true

[[bin]]
name = "minnamate"
path = "src/main.rs"

[dependencies]
minnamate-core = { path = "../../crates/core" }
# No "links" feature: its webbrowser crate needs shlwapi, which the bundled MinGW linker lacks.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.17"
# Sound output: DirectSound on Windows, ALSA on Linux, Core Audio on macOS.
tinyaudio = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Only to pick X11: winit's Wayland backend takes no file drops.
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
